
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de Secagem</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef2f5;
      color: #17212b;
    }

    header {
      background: linear-gradient(135deg, #123d32, #087b55);
      color: white;
      padding: 25px 20px;
      box-shadow: 0 4px 12px #0003;
    }

    header h1 {
      margin: 0;
      font-size: clamp(23px, 4vw, 34px);
      letter-spacing: 1px;
    }

    header p { margin: 8px 0 0; opacity: .85; }

    main {
      width: min(1100px, 94%);
      margin: 28px auto;
    }

    .section-title {
      margin: 28px 0 16px;
      font-size: 20px;
    }

    .dryer-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 18px;
    }

    .dryer {
      min-height: 115px;
      border: 1px solid #ffffff70;
      border-radius: 17px;
      color: white;
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
      text-shadow: 0 2px 3px #0005;
      box-shadow: 0 7px 0 #0003, 0 12px 18px #0002,
                  inset 0 3px 5px #ffffff70;
      transition: transform .12s, box-shadow .12s;
    }

    .dryer:hover {
      filter: brightness(1.08);
      transform: translateY(-2px);
    }

    .dryer:active {
      transform: translateY(5px);
      box-shadow: 0 2px 0 #0003, 0 5px 8px #0002,
                  inset 0 3px 5px #0002;
    }

    .d1 { background: linear-gradient(145deg, #65d94b, #218b25); }
    .d2 { background: linear-gradient(145deg, #48baff, #1262c5); }
    .d3 { background: linear-gradient(145deg, #bd83ff, #7133bd); }
    .d4 { background: linear-gradient(145deg, #ffbd55, #d66a0b); }
    .d5 { background: linear-gradient(145deg, #42d7c1, #087f78); }
    .d6 { background: linear-gradient(145deg, #ff7777, #b51e36); }
    .d7 { background: linear-gradient(145deg, #657dff, #2839a7); }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 12px;
      margin-top: 18px;
    }

    .menu-button {
      padding: 17px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(145deg, #ffffff, #dce4e9);
      color: #20312e;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 4px 0 #aeb9c0, 0 7px 12px #0002;
      transition: .12s;
    }

    .menu-button:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #aeb9c0;
    }

    #painel {
      display: none;
      margin-top: 25px;
      padding: 24px;
      border-radius: 14px;
      background: white;
      box-shadow: 0 4px 16px #0001;
    }

    #painel h2 { margin-top: 0; }

    footer {
      text-align: center;
      padding: 25px;
      color: #66727c;
      font-size: 13px;
    }
  </style>
</head>
<body>

<header>
  <h1>CONTROLE DE SECAGEM</h1>
  <p>Gestão operacional • Secagem de sementes</p>
</header>

<main>
  <h2 class="section-title">SELECIONE O SECADOR</h2>

  <div class="dryer-grid">
    <button class="dryer d1" onclick="abrirSecador(1)">SECADOR 01</button>
    <button class="dryer d2" onclick="abrirSecador(2)">SECADOR 02</button>
    <button class="dryer d3" onclick="abrirSecador(3)">SECADOR 03</button>
    <button class="dryer d4" onclick="abrirSecador(4)">SECADOR 04</button>
    <button class="dryer d5" onclick="abrirSecador(5)">SECADOR 05</button>
    <button class="dryer d6" onclick="abrirSecador(6)">SECADOR 06</button>
    <button class="dryer d7" onclick="abrirSecador(7)">SECADOR 07</button>
  </div>

  <h2 class="section-title">GESTÃO DO SISTEMA</h2>

  <div class="menu-grid">
    <button class="menu-button" onclick="abrirMenu('Ordens de Secagem')">ORDENS DE SECAGEM</button>
    <button class="menu-button" onclick="abrirMenu('Histórico')">HISTÓRICO</button>
    <button class="menu-button" onclick="abrirMenu('Compartilhar Registros')">COMPARTILHAR REGISTROS</button>
    <button class="menu-button" onclick="abrirMenu('QR Code Público')">QR CODE PÚBLICO</button>
  </div>

  <section id="painel" aria-live="polite">
    <h2 id="titulo-painel"></h2>
    <p id="texto-painel"></p>
    <button class="menu-button" onclick="fecharPainel()">VOLTAR</button>
  </section>
</main>

<footer>CONTROLE DE SECAGEM • SISTEMA OPERACIONAL</footer>

<script>
  function mostrarPainel(titulo, texto) {
    document.getElementById("titulo-painel").textContent = titulo;
    document.getElementById("texto-painel").textContent = texto;
    document.getElementById("painel").style.display = "block";
    document.getElementById("painel").scrollIntoView({ behavior: "smooth" });
  }

  function abrirSecador(numero) {
    mostrarPainel(
      "SECADOR " + String(numero).padStart(2, "0"),
      "Área do Secador " + String(numero).padStart(2, "0") +
      ". As funções operacionais serão conectadas nas próximas etapas."
    );
  }

  function abrirMenu(nome) {
    mostrarPainel(
      nome,
      "Módulo " + nome + ". Será configurado nas próximas etapas."
    );
  }

  function fecharPainel() {
    document.getElementById("painel").style.display = "none";
  }
</script>

</body>
</html>
